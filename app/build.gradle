plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'site.houseli.petalcontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'site.houseli.petalcontrol'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2-reference-matched'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies { }
